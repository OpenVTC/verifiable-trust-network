[workspace]
resolver = "3"
members = ["vtn-service", "nnm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["Glenn Gore <glenn@affinidi.com>"]
license = "Apache-2.0"
publish = false
repository = "https://github.com/OpenVTC/verifiable-trust-network"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
needless_pass_by_value = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
# The VTN protocol, shared with the VTC: model, credentials, verification, groups, relay,
# rooms, and (feature `client`) the `vtn/*` Trust Task client.
vti-vtn = { version = "0.5", features = ["client", "resolve"] }
# The receive side of the `vtn/*` Trust Tasks (`POST /v1/trust-tasks`), shared with the VTC.
vti-trust-task-server = "0.4"
# The generated `vtn/*` 0.1 payload and response types, and their schema index.
vti-specs-vtn = "0.2"
# `vtc/networks/deliver`: how this network delivers a broadcast to a member community.
vti-specs-vtc = "0.6"
# `auth/oob/*` wallet sign-in for the landing page, shared with the VTC.
vti-oob-server = "0.3"
vti-specs-core = "0.4"
trust-tasks-rs = { version = "0.37.0", default-features = false }
async-trait = "0.1"

dtg-credentials = "0.13"
affinidi-secrets-resolver = "0.5.15"
affinidi-data-integrity = "0.8"
vti-common = "0.58"
vti-secrets = "0.31"
vta-sdk = { version = "0.82", features = ["provision-client", "proof-verify", "didcomm", "tsp"] }
affinidi-did-resolver-cache-sdk = { version = "0.8.43", features = ["network"] }

anyhow = "1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
getrandom = "0.4"
multibase = "0.9"
reqwest = { version = "0.13", features = ["json"] }
serde_ignored = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "sync", "signal"] }
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

