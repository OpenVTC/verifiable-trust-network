[workspace]
resolver = "3"
members = ["vtn-core", "vtn-client", "vtn-service", "nnm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["Glenn Gore <glenn@affinidi.com>"]
license = "Apache-2.0"
publish = false
repository = "https://github.com/OpenVTC/verifiable-trust-network"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
needless_pass_by_value = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
vtn-core = { path = "vtn-core" }
vtn-client = { path = "vtn-client" }

dtg-credentials = "0.13"
affinidi-secrets-resolver = "0.5.15"
affinidi-data-integrity = "0.8"
vti-common = "0.54"
vti-secrets = "0.27"
vta-sdk = { version = "0.78", features = ["provision-client", "proof-verify", "didcomm", "tsp"] }
affinidi-did-resolver-cache-sdk = { version = "0.8.43", features = ["network"] }

anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
getrandom = "0.3"
multibase = "0.9"
reqwest = { version = "0.13", features = ["json"] }
serde_ignored = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "sync", "signal"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
