name: System dependencies
description: >
  libdbus-1-dev and pkg-config, which the OS keyring backend (via vti-secrets / vta-sdk)
  needs to build on Linux. Installs from the runner's shipped package index first, and
  refreshes the index (bounded, retried) only if that fails.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        pkgs=""
        for p in libdbus-1-dev pkg-config; do
          dpkg -s "$p" >/dev/null 2>&1 || pkgs="$pkgs $p"
        done
        if [ -z "$pkgs" ]; then
          echo "libdbus-1-dev and pkg-config already present"
          exit 0
        fi
        if sudo timeout 120 apt-get install -y --no-install-recommends $pkgs; then
          exit 0
        fi
        for attempt in 1 2 3; do
          if sudo timeout 120 apt-get -o Acquire::Retries=3 update \
            && sudo timeout 120 apt-get -o Acquire::Retries=3 install -y --no-install-recommends $pkgs; then
            exit 0
          fi
          echo "::warning::apt attempt $attempt failed; retrying in 10s"
          sleep 10
        done
        echo "::error::could not install$pkgs"
        exit 1
