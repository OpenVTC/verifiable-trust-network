[package]
name = "nnm-cli"
description = "Network Network Manager (NNM): the operator CLI for Verifiable Trust Networks, as PNM is for a person and CNM for a community"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nnm"
path = "src/main.rs"

[dependencies]
vti-vtn = { workspace = true }
vti-specs-vtn = { workspace = true }
trust-tasks-rs = { workspace = true }
affinidi-secrets-resolver = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
# `nnm registry`: TRQP queries to the trust registry over its HTTPS binding.
trql-client = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
vtn-service = { path = "../vtn-service" }
axum = { workspace = true }
rcgen = "0.14"
rustls = "0.23"
tokio-rustls = "0.26"

[lints]
workspace = true
