[package]
name = "vtn-service"
description = "Verifiable Trust Network (VTN) service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[[bin]]
name = "vtn"
path = "src/main.rs"

# Where the network's keys are kept: `[secrets] backend` in `vtn.toml` / `vtn-setup.toml`.
# `plaintext` (dev only, with `allow_plaintext = true`) and `encrypted_file` are always
# built in. Each other backend is a feature; `all-secrets` builds every one but TPM.
[features]
default = ["keyring"]
# The OS credential store: macOS Keychain, Linux Secret Service (D-Bus), Windows
# Credential Manager. A host without one still starts; only `backend = "keyring"` fails.
keyring = ["vta-sdk/keyring", "vti-secrets/keyring"]
aws-secrets = ["vti-secrets/aws-secrets"]
gcp-secrets = ["vti-secrets/gcp-secrets"]
azure-secrets = ["vti-secrets/azure-secrets"]
# A namespaced Kubernetes `Secret`, for in-cluster deployments.
k8s-secrets = ["vti-secrets/k8s-secrets"]
# HashiCorp Vault (KV v2; kubernetes, token or approle auth).
vault-secrets = ["vti-secrets/vault-secrets"]
# A TPM 2.0 key-encryption key for `encrypted_file` (`kek = { source = "tpm" }`). Linux
# only, and needs the system `libtss2` libraries to build, so not in `all-secrets`.
tpm = ["vti-secrets/tpm"]
all-secrets = [
  "keyring",
  "aws-secrets",
  "gcp-secrets",
  "azure-secrets",
  "k8s-secrets",
  "vault-secrets",
]

[dependencies]
vti-vtn = { workspace = true }
vti-trust-task-server = { workspace = true }
vti-specs-vtn = { workspace = true }
vti-specs-vtc = { workspace = true }
vti-oob-server = { workspace = true }
vti-specs-core = { workspace = true }
trust-tasks-rs = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
vti-common = { workspace = true }
vti-secrets = { workspace = true }
vta-sdk = { workspace = true }
affinidi-did-resolver-cache-sdk = { workspace = true }
serde_ignored = { workspace = true }
dtg-credentials = { workspace = true }
affinidi-data-integrity = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
qrcode = { workspace = true }

[dev-dependencies]
affinidi-secrets-resolver = { workspace = true }
# HTTPS for the in-process test networks and inboxes (tests/support/tls.rs).
rcgen = "0.14"
rustls = "0.23"
tokio-rustls = "0.26"
tempfile = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
